<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>☠️ Комбо-вирусы</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #0f0;
            font-family: 'Courier New', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s;
        }
        .container {
            background: #111;
            padding: 30px 24px;
            border-radius: 20px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            border: 1px solid #2a2a2a;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: border-color 0.3s;
        }
        .virus-icon { font-size: 50px; margin-bottom: 10px; }
        .title {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 8px;
            transition: color 0.3s;
        }
        .sub {
            color: #888;
            font-size: 14px;
            margin-bottom: 16px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 12px;
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            margin: 12px 0;
            border: 1px solid #2a2a2a;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s;
        }
        .log {
            background: #0a0a0a;
            border-radius: 12px;
            padding: 12px;
            max-height: 140px;
            overflow-y: auto;
            font-size: 13px;
            text-align: left;
            border: 1px solid #1a2a1a;
            line-height: 1.6;
            margin-top: 10px;
        }
        .log .danger { color: #ff6b6b; }
        .log .warn { color: #ffd93d; }
        .log .ok { color: #66bb6a; }
        .log .info { color: #4fc3f7; }
        .btn {
            background: #ff4444;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 14px;
            font-family: 'Courier New', monospace;
        }
        .btn:active { transform: scale(0.96); }
        .red-bg { background: #1a0000 !important; border-color: #ff4444 !important; }
        .orange-bg { background: #1a0a00 !important; border-color: #ff8800 !important; }
        .purple-bg { background: #0a001a !important; border-color: #aa44ff !important; }
        .green-bg { background: #001a00 !important; border-color: #44ff44 !important; }
        .final-box {
            display: none;
            margin-top: 16px;
            padding: 16px;
            border: 2px solid #ff4444;
            border-radius: 12px;
            background: #1a0a0a;
        }
        .final-box .big {
            font-size: 28px;
            color: #ff4444;
            font-weight: bold;
            animation: blink 0.8s infinite;
        }
        .final-box .small {
            color: #aaa;
            font-size: 14px;
            margin-top: 6px;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container" id="container">
    <div class="virus-icon" id="icon">🧬</div>
    <div class="title" id="title">ЗАГРУЗКА ВИРУСОВ</div>
    <div class="sub" id="sub">Инициализация комбо-атаки...</div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="background:#ff4444;"></div>
    </div>
    <div id="percentDisplay" style="font-size:18px;font-weight:bold;color:#ff4444;">0%</div>

    <div class="log" id="log">
        <div class="info">> Комбо-вирус активирован...</div>
    </div>

    <button class="btn" id="skipBtn">⏭ ПРОПУСТИТЬ</button>

    <div class="final-box" id="finalBox">
        <div class="big">☠️ СИСТЕМА УНИЧТОЖЕНА</div>
        <div class="small">Все вирусы активированы. Телефон под контролем.</div>
    </div>
</div>

<script>
    // ===== СПИСОК ВИРУСОВ =====
    const viruses = [
        {
            icon: '💀',
            title: 'ВИРУС-ШИФРОВАЛЬЩИК',
            sub: 'Все файлы зашифрованы. Требуется выкуп.',
            color: '#ff4444',
            bg: 'red-bg',
            log: [
                { text: 'Шифрование файлов...', type: 'danger' },
                { text: 'Доступ к документам заблокирован.', type: 'warn' },
                { text: 'Ключ шифрования сохранён на сервере.', type: 'danger' }
            ]
        },
        {
            icon: '🕷️',
            title: 'ТРОЯН-ШПИОН',
            sub: 'Данные передаются на удалённый сервер.',
            color: '#ff8800',
            bg: 'orange-bg',
            log: [
                { text: 'Подключение к серверу...', type: 'warn' },
                { text: 'Копирование контактов и фото...', type: 'danger' },
                { text: 'Данные отправлены.', type: 'info' }
            ]
        },
        {
            icon: '⌨️',
            title: 'КЕЙЛОГГЕР',
            sub: 'Все нажатия клавиш записываются.',
            color: '#aa44ff',
            bg: 'purple-bg',
            log: [
                { text: 'Перехват ввода с клавиатуры...', type: 'info' },
                { text: 'Запись паролей...', type: 'warn' },
                { text: 'Логи переданы на сервер.', type: 'danger' }
            ]
        },
        {
            icon: '⚙️',
            title: 'РУТКИТ',
            sub: 'Системные файлы изменены.',
            color: '#44ff44',
            bg: 'green-bg',
            log: [
                { text: 'Внедрение в ядро системы...', type: 'warn' },
                { text: 'Системные файлы модифицированы.', type: 'danger' },
                { text: 'Обнаружение заблокировано.', type: 'ok' }
            ]
        },
        {
            icon: '🧨',
            title: 'ФЕЙК-АНТИВИРУС',
            sub: 'Обнаружено 999 угроз. Требуется оплата.',
            color: '#ff4444',
            bg: 'red-bg',
            log: [
                { text: 'Сканирование системы...', type: 'info' },
                { text: 'Обнаружено 999 угроз.', type: 'danger' },
                { text: 'Для удаления требуется оплата 999₽.', type: 'warn' }
            ]
        }
    ];

    let currentVirus = 0;
    let progress = 0;
    let isSkipped = false;

    const container = document.getElementById('container');
    const icon = document.getElementById('icon');
    const title = document.getElementById('title');
    const sub = document.getElementById('sub');
    const progressFill = document.getElementById('progressFill');
    const percentDisplay = document.getElementById('percentDisplay');
    const logEl = document.getElementById('log');
    const finalBox = document.getElementById('finalBox');
    const skipBtn = document.getElementById('skipBtn');

    function addLog(msg, type = 'info') {
        const div = document.createElement('div');
        div.className = type;
        div.textContent = '> ' + msg;
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
    }

    function updateProgress(value) {
        progress = Math.min(value, 100);
        progressFill.style.width = progress + '%';
        percentDisplay.textContent = Math.floor(progress) + '%';
    }

    function setVirus(index) {
        const v = viruses[index];
        icon.textContent = v.icon;
        title.textContent = v.title;
        sub.textContent = v.sub;
        title.style.color = v.color;
        progressFill.style.background = v.color;
        document.body.className = v.bg;
        container.className = 'container ' + v.bg;
        // очищаем лог
        logEl.innerHTML = '';
        v.log.forEach(l => addLog(l.text, l.type));
        updateProgress(0);
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function runCombo() {
        for (let i = 0; i < viruses.length; i++) {
            if (isSkipped) break;
            currentVirus = i;
            setVirus(i);

            // прогресс от 0 до 100
            for (let p = 0; p <= 100; p += 2) {
                if (isSkipped) break;
                updateProgress(p);
                await sleep(50 + Math.random() * 40);
            }

            await sleep(600);
        }

        // финал
        if (!isSkipped) {
            finalBox.style.display = 'block';
            document.body.className = 'red-bg';
            container.className = 'container red-bg';
            icon.textContent = '☠️';
            title.textContent = 'ВСЁ УНИЧТОЖЕНО';
            sub.textContent = 'Телефон больше не подлежит восстановлению.';
            progressFill.style.width = '100%';
            percentDisplay.textContent = '100%';
            skipBtn.textContent = '🔄 ПЕРЕЗАПУСТИТЬ';
            skipBtn.onclick = () => location.reload();
        }
    }

    // ===== ПРОПУСК =====
    skipBtn.addEventListener('click', function() {
        if (isSkipped) return;
        isSkipped = true;
        finalBox.style.display = 'block';
        document.body.className = 'red-bg';
        container.className = 'container red-bg';
        icon.textContent = '⏭️';
        title.textContent = 'ПРОПУЩЕНО';
        sub.textContent = 'Вы пропустили комбо-атаку. Но вирусы уже внутри.';
        progressFill.style.width = '100%';
        percentDisplay.textContent = '100%';
        logEl.innerHTML = '<div class="warn">> Комбо прервано пользователем.</div>';
        skipBtn.textContent = '🔄 ПЕРЕЗАПУСТИТЬ';
        skipBtn.onclick = () => location.reload();
    });

    // ===== АВТОЗАПУСК =====
    setTimeout(() => {
        runCombo();
    }, 600);
</script>
</body>
</html>
